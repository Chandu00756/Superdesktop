name: Omega CI

on:
  push:
    branches: [ version2.0 ]
  pull_request:
    branches: [ version2.0 ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=25 --max-line-length=140 --statistics
      - name: Security scan
        run: bandit -q -r .
      - name: Tests
        run: pytest -q
